[project]
name = "tripsignal"
version = "0.1.0"
description = "Contract rate assurance agent for travel operations (synthetic-data MVP)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.14",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.13.1",
  "SQLAlchemy==2.0.48",
  "openai==2.29.0",
  "groq==1.7.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.6", "mypy==1.19.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]
