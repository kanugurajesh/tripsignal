services:
  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-oracle}
      AS_OF_DATE: ${AS_OF_DATE:-2026-10-20}
      DATABASE_URL: sqlite:////data/tripsignal.db
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - tripsignal-data:/data
    ports:
      - "8000:8000"
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  tripsignal-data:
